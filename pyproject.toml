[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-schema-alignment"
version = "0.1.0"
description = "Extensible CSV schema matching engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv-schema-align = "schema_alignment.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

