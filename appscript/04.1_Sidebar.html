<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Nhúng Google Font 'Inter' để tăng tính thẩm mỹ cao cấp -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-main: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --danger-bg: #fee2e2;
        --success: #10b981;
        --success-bg: #d1fae5;
        --warning: #f59e0b;
        --warning-bg: #fef3c7;
        --radius-lg: 12px;
        --radius-md: 8px;
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        font-family: 'Inter', sans-serif;
        padding: 0;
        margin: 0;
        background-color: var(--bg-main);
        color: var(--text-main);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        padding: 16px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        box-sizing: border-box;
      }

      /* STYLE HEADER MỚI ĐỒNG BỘ */
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #f8fafc;
        border-bottom: 1px solid var(--border-color);
        margin: -16px -16px 12px -16px;
      }
      .sidebar-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      body.in-iframe .sidebar-header {
        display: none !important;
      }
      body.in-iframe .container {
        padding-top: 8px !important;
      }

      /* SECTIONS Layout */
      .section-box {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 14px;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 6px;
      }

      .section-header h2 {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--primary);
        margin: 0;
      }

      .list-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-right: 2px;
      }

      /* PHẦN DANH SÁCH RULES & LISTS */
      .rule-card, .list-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 12px 14px;
        margin-bottom: 0;
        transition: var(--transition);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        box-sizing: border-box;
      }
      .rule-card:hover, .list-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        border-color: #cbd5e1;
      }

      /* Container nút thay đổi thứ tự card */
      .order-buttons {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-right: 6px;
        flex-shrink: 0;
        user-select: none;
      }
      .order-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 2px;
        border-radius: 4px;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .order-btn:hover {
        background-color: #f1f5f9;
        color: var(--primary);
      }
      .order-btn:active {
        transform: scale(0.9);
      }
      .order-btn:disabled {
        color: #e2e8f0;
        cursor: not-allowed;
        pointer-events: none;
      }

      /* Phần chứa thông tin card (có thể click) */
      .card-info-content {
        flex-grow: 1;
        cursor: pointer;
        padding-right: 8px;
        overflow: hidden;
      }
      
      .rule-card-title, .list-card-title {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rule-card-meta, .list-card-meta {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.6;
      }
      .rule-card-meta b, .list-card-meta b {
        color: var(--text-main);
      }

      /* FORM THIẾT LẬP (DETAIL VIEW) */
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 6px;
        color: var(--text-muted);
      }
      input[type="text"], select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 13px;
        font-family: inherit;
        background-color: var(--card-bg);
        color: var(--text-main);
        transition: var(--transition);
      }
      input[type="text"]:focus, select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        outline: none;
      }

      /* Tùy chỉnh Textarea - Tự động giãn nở và không cho resize thủ công */
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 13px;
        font-family: inherit;
        background-color: var(--card-bg);
        color: var(--text-main);
        transition: var(--transition);
        resize: none;
        overflow-y: hidden;
        min-height: 110px; /* Mặc định 5 dòng */
        line-height: 1.4;
      }
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        outline: none;
      }

      /* Badge cho tên các sheet được chọn */
      .sheet-tag {
        display: inline-block;
        background-color: #e2e8f0;
        color: var(--text-main);
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        margin-right: 4px;
        margin-bottom: 4px;
      }
      .sheet-tag-empty {
        color: var(--text-muted);
        font-style: italic;
        font-size: 12px;
      }

      /* CÁC NÚT ĐIỀU KHIỂN */
      .btn {
        padding: 10px 16px;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: var(--transition);
      }
      .btn-primary {
        background-color: var(--primary);
        color: white;
      }
      .btn-primary:hover {
        background-color: var(--primary-hover);
      }
      .btn-secondary {
        background-color: var(--card-bg);
        color: var(--text-muted);
        border: 1px solid var(--border-color);
      }
      .btn-secondary:hover {
        background-color: #f1f5f9;
        color: var(--text-main);
      }
      .btn-danger {
        background-color: var(--danger);
        color: white;
      }
      .btn-danger:hover {
        background-color: var(--danger-hover);
      }
      .button-group {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
        gap: 8px;
      }
      
      /* Nút xóa trên Card */
      .card-delete-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
        padding: 6px;
        border-radius: var(--radius-md);
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .card-delete-btn:hover {
        background-color: var(--danger-bg);
        color: var(--danger-hover);
      }
      .card-delete-btn svg {
        stroke: var(--text-muted);
        transition: var(--transition);
      }
      .card-delete-btn:hover svg {
        stroke: var(--danger);
      }

      /* THÀNH PHẦN TRẠNG THÁI (STATUS CARD) */
      #status, #statusListForm {
        margin-top: 14px;
        font-weight: 500;
        text-align: center;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        display: none;
        animation: fadeIn 0.2s ease-out;
        font-size: 12px;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* SCROLLBAR STYLE */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* THIẾT KẾ CHO CHỌN DROPDOWNS LIÊN KẾT */
      .selected-dropdowns-area {
        border: 1px dashed var(--border-color);
        border-radius: var(--radius-lg);
        padding: 10px;
        min-height: 60px;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .selected-dropdowns-area:empty::after {
        content: "Chưa có dropdown nào được liên kết. Nhấn [+] để thêm.";
        color: var(--text-muted);
        font-style: italic;
        text-align: center;
        display: block;
        padding: 15px 0;
        font-size: 12px;
      }
      .selected-item-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #f8fafc;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 8px 10px;
        gap: 8px;
      }
      .selected-item-name {
        font-weight: 500;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-grow: 1;
      }
      .selected-item-range-input {
        width: 90px !important;
        padding: 5px 8px !important;
        font-size: 12px !important;
        margin: 0 !important;
      }
      .btn-remove-link {
        background: none;
        border: none;
        color: var(--text-muted);
        font-weight: bold;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 4px;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-remove-link:hover {
        background-color: var(--danger-bg);
        color: var(--danger-hover);
      }
      .btn-remove-link svg {
        stroke: var(--text-muted);
        transition: var(--transition);
      }
      .btn-remove-link:hover svg {
        stroke: var(--danger);
      }
      .btn-text-add {
        background: none;
        border: none;
        color: var(--primary);
        font-weight: 600;
        cursor: pointer;
        padding: 2px 6px;
        font-size: 12px;
        border-radius: 4px;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .btn-text-add:hover {
        background-color: rgba(37, 99, 235, 0.1);
        color: var(--primary-hover);
      }

      /* MODAL CHỌN DROPDOWNS & XÁC NHẬN - ĐÃ GỠ BỎ BLUR XUNG QUANH */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.4); /* Overlay nhẹ hơn không blur */
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease-out;
      }
      .modal-content {
        background-color: var(--card-bg);
        padding: 20px;
        border-radius: var(--radius-lg);
        width: 240px; /* Cố định chiều rộng 240px cho tất cả các modals để có margin 2 bên đồng đều */
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        border: 1px solid var(--border-color);
        box-sizing: border-box; /* Đảm bảo padding không làm nở rộng chiều rộng */
      }
      .modal-content h3 {
        margin-top: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 6px;
      }
      .selector-list {
        flex-grow: 1;
        overflow-y: auto;
        margin-bottom: 16px;
        max-height: 250px;
        padding-right: 4px;
      }
      .selector-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
      }
      .selector-item:hover {
        background-color: #f1f5f9;
      }
      .selector-item input[type="checkbox"] {
        cursor: pointer;
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }
      .selector-item label {
        cursor: pointer;
        font-weight: 500;
        user-select: none;
        flex-grow: 1;
      }
      .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid var(--border-color);
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar-header">
        <span class="sidebar-title">Dropdown Manager</span>
      </div>
      
      <!-- ================================================
           MÀN HÌNH DANH SÁCH CHÍNH (LIST VIEW)
           ================================================ -->
      <div id="listView" style="display: flex; flex-direction: column; gap: 16px;">
        
        <!-- SECTION 1: DROPDOWN RULES (TOP) -->
        <div class="section-box">
          <div class="section-header">
            <h2>Quy tắc áp dụng</h2>
            <button class="btn btn-primary" style="font-size: 10px; padding: 3px 6px;" onclick="createNewRule()">+ Thêm</button>
          </div>
          <div class="list-container" id="rulesList">
            <div style="color: var(--text-muted); text-align: center; padding: 10px 0;">Đang tải danh sách quy tắc...</div>
          </div>
        </div>
        
        <!-- SECTION 2: DROPDOWN LISTS (BOTTOM) -->
        <div class="section-box">
          <div class="section-header">
            <h2>Danh sách Dropdown</h2>
            <button class="btn btn-primary" style="font-size: 10px; padding: 3px 6px;" onclick="createNewList()">+ Thêm</button>
          </div>
          <div class="list-container" id="listsList">
            <div style="color: var(--text-muted); text-align: center; padding: 10px 0;">Đang tải danh sách dropdown...</div>
          </div>
        </div>

      </div>
      
      <!-- ================================================
           MODAL CẤU HÌNH DROPDOWN RULE
           ================================================ -->
      <div id="detailRuleModal" class="modal">
        <div class="modal-content" style="width: 250px; max-height: 90vh;">
          <h3 id="ruleFormTitle" style="margin-top: 0; font-size: 12.5px; font-weight: 600; color: var(--primary); margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">Cấu hình Quy tắc</h3>
          
          <input type="hidden" id="ruleId">
          
          <div class="form-group" style="margin-bottom: 10px;">
            <label for="ruleName" style="display: block; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; font-size: 11px;">Tên quy tắc</label>
            <input type="text" id="ruleName" placeholder="Ví dụ: Quy tắc Sheet Tháng" style="width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 12px; margin-bottom: 0;">
          </div>
          
          <div class="form-group" style="margin-bottom: 10px;">
            <label for="matchType" style="display: block; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; font-size: 11px;">Áp dụng cho Sheet</label>
            <select id="matchType" onchange="toggleMatchValue()" style="width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 12px; margin-bottom: 0;">
              <option value="all">Tất cả các Sheet</option>
              <option value="selected">Các sheet được lựa chọn...</option>
              <option value="starts_with">Tên Sheet bắt đầu bằng...</option>
              <option value="ends_with">Tên Sheet kết thúc bằng...</option>
              <option value="exact">Tên Sheet chính xác là...</option>
            </select>
          </div>
          
          <div class="form-group" id="matchValueGroup" style="display: none; margin-bottom: 10px;">
            <label for="matchValue" style="display: block; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; font-size: 11px;">Từ khóa tìm kiếm tên Sheet</label>
            <input type="text" id="matchValue" placeholder="Ví dụ: Tháng" style="width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 12px; margin-bottom: 0;">
          </div>

          <div class="form-group" id="selectedSheetsGroup" style="display: none; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label style="margin-bottom: 0; font-weight: 500; color: var(--text-muted); font-size: 11px;">Các sheet được chọn</label>
              <button type="button" class="btn-text-add" onclick="openSheetSelector()" style="background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; font-size: 11px; padding: 0;">Sửa</button>
            </div>
            <div id="selectedSheetsArea" style="min-height: 40px; padding: 6px; border: 1px dashed var(--border-color); border-radius: var(--radius-lg); background-color: #ffffff; max-height: 120px; overflow-y: auto;"></div>
          </div>
          
          <div class="form-group" style="margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label style="margin-bottom: 0; font-weight: 500; color: var(--text-muted); font-size: 11px;">Dropdowns liên kết</label>
              <button type="button" class="btn-text-add" onclick="openDropdownSelector()" style="background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; font-size: 11px; padding: 0;">Thêm</button>
            </div>
            <div id="selectedDropdownsArea" class="selected-dropdowns-area" style="max-height: 180px; overflow-y: auto;"></div>
          </div>
          
          <div id="status" style="display: none; padding: 6px; border-radius: var(--radius-md); font-size: 11px; margin-bottom: 10px; text-align: center;"></div>
          
          <div class="modal-buttons" style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 6px;">
            <button class="btn btn-secondary" onclick="backToList()" style="padding: 4px 8px; font-size: 11px;">Hủy</button>
            <button class="btn btn-primary" onclick="saveCurrentRule()" style="flex-grow: 1; padding: 4px 8px; font-size: 11px;">Lưu & Chạy</button>
          </div>
        </div>
      </div>

      <!-- ================================================
           MODAL CẦU HÌNH DROPDOWN LIST
           ================================================ -->
      <div id="detailListModal" class="modal">
        <div class="modal-content" style="width: 250px; max-height: 90vh;">
          <h3 id="listFormTitle" style="margin-top: 0; font-size: 12.5px; font-weight: 600; color: var(--primary); margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">Cấu hình Danh sách</h3>
          
          <input type="hidden" id="listId">
          
          <div class="form-group" style="margin-bottom: 10px;">
            <label for="listName" style="display: block; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; font-size: 11px;">Tên danh sách dropdown</label>
            <input type="text" id="listName" placeholder="Ví dụ: Trạng thái công việc" style="width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 12px; margin-bottom: 0;">
          </div>
          
          <div class="form-group" style="margin-bottom: 10px; display: flex; flex-direction: column; flex-grow: 1; min-height: 120px;">
            <label for="listOptions" style="display: block; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; font-size: 11px;">Giá trị Dropdown (mỗi dòng 1 lựa chọn)</label>
            <textarea id="listOptions" placeholder="Đang chuẩn bị&#10;Đang thực hiện&#10;Đã hoàn thành..." style="width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 12px; background-color: var(--card-bg); color: var(--text-main); transition: var(--transition); resize: none; flex-grow: 1; min-height: 100px; outline: none;"></textarea>
          </div>
          
          <div id="statusListForm" style="display: none; padding: 6px; border-radius: var(--radius-md); font-size: 11px; margin-bottom: 10px; text-align: center;"></div>
          
          <div class="modal-buttons" style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 6px;">
            <button class="btn btn-secondary" onclick="backToList()" style="padding: 4px 8px; font-size: 11px;">Hủy</button>
            <button class="btn btn-primary" onclick="saveCurrentList()" style="flex-grow: 1; padding: 4px 8px; font-size: 11px;">Lưu danh sách</button>
        </div>
      </div>
      
    </div>

    <!-- ================================================
         MODAL CHỌN DROPDOWNS LIÊN KẾT
         ================================================ -->
    <div id="dropdownSelectorModal" class="modal">
      <div class="modal-content">
        <h3>Chọn danh sách Dropdown</h3>
        <div id="selectorList" class="selector-list"></div>
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeDropdownSelector()">Hủy</button>
          <button class="btn btn-primary" onclick="applyDropdownSelection()">
            <svg style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;margin-right:4px;vertical-align:middle;" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Xác nhận

    <!-- ================================================
         MODAL CHỌN CÁC SHEET ÁP DỤNG
         ================================================ -->
    <div id="sheetSelectorModal" class="modal">
      <div class="modal-content">
        <h3>Chọn danh sách Sheet áp dụng</h3>
        <div id="sheetSelectorList" class="selector-list"></div>
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeSheetSelector()">Hủy</button>
          <button class="btn btn-primary" onclick="applySheetSelection()">
            <svg style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;margin-right:4px;vertical-align:middle;" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Xác nhận
          </button>
        </div>
      </div>
    </div>

    <!-- ================================================
         MODAL XÁC NHẬN XÓA TÙY CHỈNH (CUSTOM CONFIRM)
         ================================================ -->
    <div id="confirmModal" class="modal" style="z-index: 1100;">
      <div class="modal-content">
        <h3 id="confirmTitle" style="color: var(--danger); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin-bottom: 10px;">Xác nhận xóa</h3>
        <p id="confirmMessage" style="font-size: 12px; color: var(--text-main); margin-bottom: 20px; line-height: 1.5; text-align: left;"></p>
        <div class="modal-buttons" style="border-top: none; padding-top: 0;">
          <button class="btn btn-secondary" onclick="closeConfirmModal()">Hủy</button>
          <button class="btn btn-danger" id="btnConfirmDelete" onclick="executeDeleteAction()">Xóa</button>
        </div>
      </div>
    </div>

    <!-- ================================================
         MODAL THÔNG BÁO TÙY CHỈNH (CUSTOM ALERT)
         ================================================ -->
    <div id="alertModal" class="modal" style="z-index: 1200;">
      <div class="modal-content">
        <h3 style="color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin-bottom: 10px;">Thông báo</h3>
        <p id="alertMessage" style="font-size: 12px; color: var(--text-main); margin-bottom: 20px; line-height: 1.5; text-align: left;"></p>
        <div class="modal-buttons" style="border-top: none; padding-top: 0;">
          <button class="btn btn-primary" onclick="closeAlertModal()">Đồng ý</button>
        </div>
      </div>
    </div>

    <script>
      var allLists = []; // Lưu trữ tất cả danh sách dropdown lấy từ backend
      var allRules = []; // Lưu trữ tất cả quy tắc lấy từ backend
      var listsLoaded = false; // Trạng thái tải của lists
      var rulesLoaded = false; // Trạng thái tải của rules

      // ---- PERFORMANCE OPTIMIZATION UTILITIES ----
      var RENDER_CHUNK_SIZE = 30;
      var _renderCache = {};
      function _getCacheKey(data) { return JSON.stringify(data); }
      function _shouldReRender(cacheKey) {
        if (_renderCache[cacheKey]) return false;
        _renderCache[cacheKey] = true;
        return true;
      }
      function _clearRenderCache() { _renderCache = {}; }
      function _debounce(fn, wait) {
        var timer;
        return function() {
          var args = arguments, ctx = this;
          clearTimeout(timer);
          timer = setTimeout(function() { fn.apply(ctx, args); }, wait);
        };
      }
      function _chunkedHtmlRender(container, items, renderFn) {
        if (!items || items.length === 0) {
          container.innerHTML = renderFn(items);
          return;
        }
        if (items.length <= RENDER_CHUNK_SIZE) {
          container.innerHTML = renderFn(items);
          return;
        }
        container.innerHTML = '';
        var idx = 0;
        function nextChunk() {
          var end = Math.min(idx + RENDER_CHUNK_SIZE, items.length);
          var html = renderFn(items.slice(idx, end), idx > 0);
          container.insertAdjacentHTML('beforeend', html);
          idx = end;
          if (idx < items.length) {
            setTimeout(nextChunk, 0);
          }
        }
        setTimeout(nextChunk, 0);
      }
      
      // Biến trạng thái lưu trữ dropdowns đã liên kết trong form chỉnh sửa Rule hiện tại
      // Mỗi phần tử có dạng: { dropdownListId: "id", range: "range" }
      var currentSelectedDropdowns = []; 

      // Biến trạng thái lưu trữ các sheet được lựa chọn cho Rule hiện tại
      var currentSelectedSheets = [];

      // Biến hỗ trợ Custom Confirm Modal
      var pendingDeleteAction = null;

      // Tự động tải dữ liệu khi mở Sidebar
      window.onload = function() {
        if (window.self !== window.top) {
          document.body.classList.add('in-iframe');
        }
        refreshAllData();
        setupAutoGrowTextarea();
        startRealtimeSync();
      };

      // Helper gửi request API qua Cổng kết nối duy nhất (Single Entry Point) handleApiRequest
      function callApi(action, data, onSuccess, onFailure) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(function(err) {
            var errMsg = err.toString();
            if (errMsg.indexOf("Bạn không có quyền truy cập") !== -1) {
              google.script.run.showAccessDeniedAlert();
              google.script.host.close();
              return;
            }
            if (onFailure) {
              onFailure(err);
            } else {
              showCustomAlert("Lỗi kết nối máy chủ: " + errMsg);
            }
          })
          .handleApiRequest({ action: action, data: data });
      }

      // Cài đặt sự kiện co giãn tự động cho textarea options
      function setupAutoGrowTextarea() {
        var tx = document.getElementById('listOptions');
        tx.addEventListener("input", function() {
          adjustTextareaHeight(this);
        }, false);
      }

      // Điều chỉnh chiều cao của textarea dựa trên dòng text
      function adjustTextareaHeight(el) {
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      }

      // Logic cho Custom Alert Dialog
      function showCustomAlert(message) {
        document.getElementById('alertMessage').innerText = message;
        document.getElementById('alertModal').style.display = "flex";
      }

      function closeAlertModal() {
        document.getElementById('alertModal').style.display = "none";
      }

      // Logic cho Custom Confirm Dialog
      function showCustomConfirm(title, message, callback) {
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmMessage').innerText = message;
        pendingDeleteAction = callback;
        document.getElementById('confirmModal').style.display = "flex";
      }

      function closeConfirmModal() {
        document.getElementById('confirmModal').style.display = "none";
        pendingDeleteAction = null;
      }

      function executeDeleteAction() {
        if (pendingDeleteAction) {
          pendingDeleteAction();
        }
        closeConfirmModal();
      }

      // Biến quản lý đồng bộ thời gian thực
      var lastCheckedTimestamp = null;

      function updateLocalSyncTimestamp() {
        callApi('getLastChangedTimestamp', null, function(ts) {
          lastCheckedTimestamp = ts || "0";
        });
      }

      var _debouncedRefresh = _debounce(function() { refreshAllData(); }, 300);

      function startRealtimeSync() {
        setInterval(function() {
          if (lastCheckedTimestamp === null) return;
          callApi('getLastChangedTimestamp', null, function(ts) {
            if (ts && ts !== lastCheckedTimestamp) {
              console.log("Phát hiện thay đổi từ người dùng khác, tự động đồng bộ...");
              lastCheckedTimestamp = ts;
              _debouncedRefresh();
            }
          });
        }, 5000);
      }

      // Tải và hiển thị toàn bộ dữ liệu từ server qua handleApiRequest
      function refreshAllData() {
        _clearRenderCache();
        document.getElementById('rulesList').innerHTML = "<div style='color: var(--text-muted); text-align: center; padding: 15px 0;'>Đang tải danh sách...</div>";
        document.getElementById('listsList').innerHTML = "<div style='color: var(--text-muted); text-align: center; padding: 15px 0;'>Đang tải danh sách...</div>";
        
        listsLoaded = false;
        rulesLoaded = false;

        // Tải danh sách dropdown (lists)
        callApi('getLists', null, 
          function(lists) {
            allLists = lists || [];
            listsLoaded = true;
            renderLists(allLists);
            
            if (rulesLoaded) {
              renderRules(allRules);
              updateLocalSyncTimestamp();
            }
          },
          function(err) {
            listsLoaded = true;
            document.getElementById('listsList').innerHTML = `<div style="color: var(--danger); text-align: center; padding: 15px 0; font-size: 0.9rem;">
              Không thể tải danh sách dropdown.<br>
              <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 5px; line-height: 1.4;">
                Chi tiết lỗi: ${err.toString()}<br>
                Gợi ý: Nếu bạn sử dụng trình duyệt Brave/Safari hoặc đăng nhập nhiều tài khoản Google cùng lúc, hãy tắt Brave Shields (Lion icon), cho phép cookie bên thứ ba hoặc dùng cửa sổ ẩn danh.
              </small>
            </div>`;
          }
        );

        // Tải danh sách quy tắc áp dụng (rules)
        callApi('getRules', null,
          function(rules) {
            allRules = rules || [];
            rulesLoaded = true;
            renderRules(allRules);
            
            if (listsLoaded) {
              updateLocalSyncTimestamp();
            }
          },
          function(err) {
            rulesLoaded = true;
            document.getElementById('rulesList').innerHTML = `<div style="color: var(--danger); text-align: center; padding: 15px 0; font-size: 0.9rem;">
              Không thể tải danh sách quy tắc.<br>
              <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 5px; line-height: 1.4;">
                Chi tiết lỗi: ${err.toString()}<br>
                Gợi ý: Nếu bạn sử dụng trình duyệt Brave/Safari hoặc đăng nhập nhiều tài khoản Google cùng lúc, hãy tắt Brave Shields (Lion icon), cho phép cookie bên thứ ba hoặc dùng cửa sổ ẩn danh.
              </small>
            </div>`;
          }
        );
      }

      /**
       * Đổi vị trí card với hiệu ứng swap mượt mà (FLIP Animation)
       */
      function moveCard(event, id, direction, type) {
        event.stopPropagation(); // Ngăn chặn sự kiện click mở form chi tiết card
        
        var array = (type === 'rule') ? allRules : allLists;
        var renderFunc = (type === 'rule') ? renderRules : renderLists;
        var saveFunc = (type === 'rule') ? saveRulesOrderToServer : saveListsOrderToServer;
        var containerId = (type === 'rule') ? 'rulesList' : 'listsList';
        
        var index = array.findIndex(function(item) { return item.id === id; });
        if (index === -1) return;
        
        var targetIndex = (direction === 'up') ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= array.length) return;
        
        // Lấy các phần tử DOM thực tế để thực hiện animation
        var container = document.getElementById(containerId);
        var cards = Array.from(container.children).filter(function(child) {
          return child.classList.contains(type + '-card');
        });
        
        var currentCard = cards[index];
        var targetCard = cards[targetIndex];
        
        if (currentCard && targetCard) {
          // Tính khoảng cách dịch chuyển dọc giữa 2 card
          var offset = targetCard.offsetTop - currentCard.offsetTop;
          
          // Khóa click chuột trong lúc chạy hiệu ứng để tránh spam click
          currentCard.style.pointerEvents = 'none';
          targetCard.style.pointerEvents = 'none';
          
          // Thực thi hiệu ứng dịch chuyển mượt mà (FLIP)
          currentCard.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
          currentCard.style.transform = 'translateY(' + offset + 'px)';
          
          targetCard.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
          targetCard.style.transform = 'translateY(' + (-offset) + 'px)';
          
          // Chờ hiệu ứng kết thúc rồi mới cập nhật mảng dữ liệu và render lại
          setTimeout(function() {
            currentCard.style.transform = '';
            currentCard.style.transition = '';
            currentCard.style.pointerEvents = '';
            
            targetCard.style.transform = '';
            targetCard.style.transition = '';
            targetCard.style.pointerEvents = '';
            
            // Đổi chỗ thực tế trong bộ nhớ tạm
            var temp = array[index];
            array[index] = array[targetIndex];
            array[targetIndex] = temp;
            
            // Vẽ lại danh sách và đồng bộ lưu thứ tự lên server
            renderFunc(array);
            saveFunc();
          }, 250);
        } else {
          // Fallback dự phòng nếu không lấy được DOM: swap trực tiếp
          var temp = array[index];
          array[index] = array[targetIndex];
          array[targetIndex] = temp;
          renderFunc(array);
          saveFunc();
        }
      }

      function saveRulesOrderToServer() {
        callApi('saveRulesOrder', allRules,
          function(response) {
            if (!response.success) {
              showCustomAlert("Lỗi khi lưu thứ tự quy tắc: " + response.message);
            }
          },
          function(err) {
            showCustomAlert("Lỗi kết nối lưu thứ tự: " + err.toString());
          }
        );
      }

      function saveListsOrderToServer() {
        callApi('saveListsOrder', allLists,
          function(response) {
            if (!response.success) {
              showCustomAlert("Lỗi khi lưu thứ tự danh sách: " + response.message);
            }
          },
          function(err) {
            showCustomAlert("Lỗi kết nối lưu thứ tự: " + err.toString());
          }
        );
      }

      // Helper xây dựng HTML cho một Rule card
      function _buildRuleHtml(rule, idx, total, listMap) {
        var matchText = "";
        if (rule.matchType === 'all') matchText = "Tất cả các sheet";
        else if (rule.matchType === 'selected') {
          var sheetsSnippet = (rule.selectedSheets || []).join(', ');
          if (sheetsSnippet.length > 20) { sheetsSnippet = sheetsSnippet.slice(0, 18) + '...'; }
          matchText = "Các sheet chọn [" + (rule.selectedSheets || []).length + "]: " + sheetsSnippet;
        }
        else if (rule.matchType === 'starts_with') matchText = "Sheet bắt đầu bằng '" + rule.matchValue + "'";
        else if (rule.matchType === 'ends_with') matchText = "Sheet kết thúc bằng '" + rule.matchValue + "'";
        else if (rule.matchType === 'exact') matchText = "Sheet tên chính xác '" + rule.matchValue + "'";

        var linkedHtml = "";
        if (rule.dropdowns && rule.dropdowns.length > 0) {
          rule.dropdowns.forEach(function(d) {
            var dlName = listMap[d.dropdownListId] || "Dropdown không tồn tại";
            linkedHtml += ` - <b>${escapeHtml(dlName)}</b>: ${escapeHtml(d.range || "A1:A100")}<br>`;
          });
        } else { linkedHtml = " - <i>Chưa có dropdown nào được liên kết</i>"; }

        var isFirst = (idx === 0);
        var isLast = (idx === total - 1);

        return '<div class="rule-card" data-id="' + rule.id + '">' +
          '<div class="order-buttons">' +
            '<button class="order-btn" onclick="moveCard(event,\'' + rule.id + '\',\'up\',\'rule\')"' + (isFirst ? ' disabled' : '') + ' title="Di chuyển lên">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>' +
            '</button>' +
            '<button class="order-btn" onclick="moveCard(event,\'' + rule.id + '\',\'down\',\'rule\')"' + (isLast ? ' disabled' : '') + ' title="Di chuyển xuống">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
            '</button>' +
          '</div>' +
          '<div class="card-info-content" onclick="openRuleDetail(\'' + rule.id + '\')">' +
            '<div class="rule-card-title">' + escapeHtml(rule.name) + '</div>' +
            '<div class="rule-card-meta">Sheet: <i>' + escapeHtml(matchText) + '</i><br>Dropdowns:<br>' + linkedHtml + '</div>' +
          '</div>' +
          '<button class="card-delete-btn" onclick="deleteRuleFromCard(event,\'' + rule.id + '\')" title="Xóa quy tắc">' +
            '<svg style="width:14px;height:14px;stroke:var(--text-muted);stroke-width:2;fill:none;" viewBox="0 0 24 24">' +
              '<polyline points="3 6 5 6 21 6"></polyline>' +
              '<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>' +
              '<line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>' +
            '</svg>' +
          '</button>' +
        '</div>';
      }

      // Vẽ danh sách các Rules lên màn hình chính (chunked rendering nếu > ngưỡng)
      function renderRules(rules) {
        var container = document.getElementById('rulesList');
        if (!rules || rules.length === 0) {
          container.innerHTML = "<p style='color: var(--text-muted); text-align: center; padding: 20px 10px; border: 1px dashed var(--border-color); border-radius: var(--radius-lg); background: white; margin: 0;'>Chưa có quy tắc nào được thiết lập.</p>";
          return;
        }

        var listMap = {};
        allLists.forEach(function(l) { listMap[l.id] = l.name; });
        var total = rules.length;

        var buildAll = function() {
          var html = "";
          for (var i = 0; i < total; i++) { html += _buildRuleHtml(rules[i], i, total, listMap); }
          container.innerHTML = html;
        };

        if (total <= RENDER_CHUNK_SIZE) { buildAll(); return; }

        container.innerHTML = '';
        var idx = 0;
        function nextChunk() {
          var end = Math.min(idx + RENDER_CHUNK_SIZE, total);
          var html = "";
          for (var i = idx; i < end; i++) { html += _buildRuleHtml(rules[i], i, total, listMap); }
          container.insertAdjacentHTML('beforeend', html);
          idx = end;
          if (idx < total) { setTimeout(nextChunk, 0); }
        }
        setTimeout(nextChunk, 0);
      }

      // Helper xây dựng HTML cho một List card
      function _buildListHtml(list, idx, total) {
        var optionsSnippet = list.options.slice(0, 3).join(', ');
        if (list.options.length > 3) { optionsSnippet += '...'; }
        var isFirst = (idx === 0);
        var isLast = (idx === total - 1);

        return '<div class="list-card" data-id="' + list.id + '">' +
          '<div class="order-buttons">' +
            '<button class="order-btn" onclick="moveCard(event,\'' + list.id + '\',\'up\',\'list\')"' + (isFirst ? ' disabled' : '') + ' title="Di chuyển lên">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>' +
            '</button>' +
            '<button class="order-btn" onclick="moveCard(event,\'' + list.id + '\',\'down\',\'list\')"' + (isLast ? ' disabled' : '') + ' title="Di chuyển xuống">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
            '</button>' +
          '</div>' +
          '<div class="card-info-content" onclick="openListDetail(\'' + list.id + '\')">' +
            '<div class="list-card-title">' + escapeHtml(list.name) + '</div>' +
            '<div class="list-card-meta">Lựa chọn: <span style="color: var(--text-main); font-weight: 500;">' + escapeHtml(optionsSnippet) + '</span></div>' +
          '</div>' +
          '<button class="card-delete-btn" onclick="deleteListFromCard(event,\'' + list.id + '\')" title="Xóa danh sách">' +
            '<svg style="width:14px;height:14px;stroke:var(--text-muted);stroke-width:2;fill:none;" viewBox="0 0 24 24">' +
              '<polyline points="3 6 5 6 21 6"></polyline>' +
              '<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>' +
              '<line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>' +
            '</svg>' +
          '</button>' +
        '</div>';
      }

      // Vẽ danh sách các Dropdown Lists lên màn hình chính (chunked rendering nếu > ngưỡng)
      function renderLists(lists) {
        var container = document.getElementById('listsList');
        if (!lists || lists.length === 0) {
          container.innerHTML = "<p style='color: var(--text-muted); text-align: center; padding: 20px 10px; border: 1px dashed var(--border-color); border-radius: var(--radius-lg); background: white; margin: 0;'>Chưa có danh sách nào được thiết lập.</p>";
          return;
        }

        var total = lists.length;
        var buildAll = function() {
          var html = "";
          for (var i = 0; i < total; i++) { html += _buildListHtml(lists[i], i, total); }
          container.innerHTML = html;
        };

        if (total <= RENDER_CHUNK_SIZE) { buildAll(); return; }

        container.innerHTML = '';
        var idx = 0;
        function nextChunk() {
          var end = Math.min(idx + RENDER_CHUNK_SIZE, total);
          var html = "";
          for (var i = idx; i < end; i++) { html += _buildListHtml(lists[i], i, total); }
          container.insertAdjacentHTML('beforeend', html);
          idx = end;
          if (idx < total) { setTimeout(nextChunk, 0); }
        }
        setTimeout(nextChunk, 0);
      }

      // Hàm escape HTML chống XSS
      function escapeHtml(str) {
        if (!str) return '';
        return str.toString().replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
      }

      // Chuyển view
      function switchView(view) {
        document.getElementById('status').style.display = "none";
        document.getElementById('statusListForm').style.display = "none";
        
        document.getElementById('listView').style.display = 'flex';
        document.getElementById('detailRuleModal').style.display = (view === 'detailRule') ? 'flex' : 'none';
        document.getElementById('detailListModal').style.display = (view === 'detailList') ? 'flex' : 'none';
      }

      // Quay lại màn hình chính
      function backToList() {
        switchView('list');
        refreshAllData();
      }

      // Hiện / Ẩn phần nhập điều kiện khớp tên sheet
      function toggleMatchValue() {
        var type = document.getElementById('matchType').value;
        var groupValue = document.getElementById('matchValueGroup');
        var groupSelected = document.getElementById('selectedSheetsGroup');
        
        if (type === 'all') {
          groupValue.style.display = 'none';
          groupSelected.style.display = 'none';
        } else if (type === 'selected') {
          groupValue.style.display = 'none';
          groupSelected.style.display = 'block';
        } else {
          groupValue.style.display = 'block';
          groupSelected.style.display = 'none';
        }
      }

      /* ================================================
         LOGIC CHO FORM DROPDOWN LIST (THÊM / SỬA)
         ================================================ */
      function createNewList() {
        document.getElementById('listFormTitle').innerText = 'Thêm danh sách mới';
        document.getElementById('listId').value = "list_" + new Date().getTime();
        document.getElementById('listName').value = "";
        
        var tx = document.getElementById('listOptions');
        tx.value = "";
        tx.style.height = "110px"; // Đặt lại chiều cao ban đầu tương ứng 5 dòng
        
        switchView('detailList');
      }

      function openListDetail(id) {
        var list = allLists.find(function(l) { return l.id === id; });
        if (!list) return;

        document.getElementById('listFormTitle').innerText = 'Chỉnh sửa danh sách';
        document.getElementById('listId').value = list.id;
        document.getElementById('listName').value = list.name;
        
        var tx = document.getElementById('listOptions');
        tx.value = list.options.join('\n');

        switchView('detailList');
        adjustTextareaHeight(tx);
      }

      function saveCurrentList() {
        var name = document.getElementById('listName').value.trim();
        var optionsText = document.getElementById('listOptions').value;
        
        if (!name) { showCustomAlert("Vui lòng nhập Tên danh sách!"); return; }
        if (!optionsText.trim()) { showCustomAlert("Người dùng không truyền giá trị nào vào trong dropdown list. Vui lòng điền nội dung!"); return; }

        var optionsArray = optionsText.split('\n')
                                     .map(function(item) { return item.trim(); })
                                     .filter(function(item) { return item !== ""; });

        var listData = {
          id: document.getElementById('listId').value,
          name: name,
          options: optionsArray
        };

        var statusDiv = document.getElementById('statusListForm');
        statusDiv.style.display = "block";
        statusDiv.innerText = "Đang xử lý danh sách...";
        statusDiv.style.backgroundColor = "var(--warning-bg)";
        statusDiv.style.color = "#856404";
        statusDiv.style.border = "1px solid #ffeeba";

        callApi('saveList', listData,
          function(response) {
            if (response.success) {
              statusDiv.innerText = response.message;
              statusDiv.style.backgroundColor = "var(--success-bg)";
              statusDiv.style.color = "#155724";
              statusDiv.style.border = "1px solid #c3e6cb";
              setTimeout(backToList, 2000);
            } else {
              statusDiv.innerText = "Lỗi: " + response.message;
              statusDiv.style.backgroundColor = "var(--danger-bg)";
              statusDiv.style.color = "#721c24";
              statusDiv.style.border = "1px solid #f5c6cb";
            }
          },
          function(err) {
            statusDiv.innerText = "Lỗi kết nối: " + err.toString();
            statusDiv.style.backgroundColor = "var(--danger-bg)";
            statusDiv.style.color = "#721c24";
            statusDiv.style.border = "1px solid #f5c6cb";
          }
        );
      }

      function deleteListFromCard(event, id) {
        event.stopPropagation();
        showCustomConfirm(
          "Xóa danh sách",
          "Bạn có chắc chắn muốn xóa danh sách dropdown này? Các quy tắc liên kết với nó sẽ tự động mất liên kết, các ô dropdown hiện có trên Sheet sẽ không bị ảnh hưởng.",
          function() {
            callApi('deleteList', id,
              function(response) {
                if (response.success) {
                  refreshAllData();
                } else {
                  showCustomAlert("Lỗi khi xóa: " + response.message);
                }
              },
              function(err) {
                showCustomAlert("Lỗi kết nối khi xóa: " + err.toString());
              }
            );
          }
        );
      }

      /* ================================================
         LOGIC CHO FORM DROPDOWN RULE (THÊM / SỬA)
         ================================================ */
      function createNewRule() {
        document.getElementById('ruleFormTitle').innerText = 'Thêm quy tắc mới';
        document.getElementById('ruleId').value = "rule_" + new Date().getTime();
        document.getElementById('ruleName').value = "";
        document.getElementById('matchType').value = "all";
        document.getElementById('matchValue').value = "";
        
        currentSelectedDropdowns = [];
        currentSelectedSheets = [];
        renderSelectedDropdownsArea();
        renderSelectedSheetsArea();
        toggleMatchValue();
        switchView('detailRule');
      }

      function openRuleDetail(id) {
        var rule = allRules.find(function(r) { return r.id === id; });
        if (!rule) return;

        document.getElementById('ruleFormTitle').innerText = 'Chỉnh sửa quy tắc';
        document.getElementById('ruleId').value = rule.id;
        document.getElementById('ruleName').value = rule.name;
        document.getElementById('matchType').value = rule.matchType;
        document.getElementById('matchValue').value = rule.matchValue || "";

        currentSelectedDropdowns = JSON.parse(JSON.stringify(rule.dropdowns || []));
        currentSelectedSheets = JSON.parse(JSON.stringify(rule.selectedSheets || []));
        
        renderSelectedDropdownsArea();
        renderSelectedSheetsArea();
        toggleMatchValue();
        switchView('detailRule');
      }

      function renderSelectedDropdownsArea() {
        var container = document.getElementById('selectedDropdownsArea');
        container.innerHTML = "";

        var listMap = {};
        allLists.forEach(function(l) {
          listMap[l.id] = l.name;
        });

        currentSelectedDropdowns.forEach(function(item) {
          var dlName = listMap[item.dropdownListId] || "Dropdown không tồn tại";
          var div = document.createElement('div');
          div.className = "selected-item-card";
          div.innerHTML = `
            <span class="selected-item-name">${escapeHtml(dlName)}</span>
            <div style="display: flex; align-items: center; gap: 6px;">
              <input type="text" class="selected-item-range-input" placeholder="Range (e.g. A1:A100)" 
                     value="${escapeHtml(item.range)}" oninput="updateSelectedDropdownRange(this, '${item.dropdownListId}')">
              <button type="button" class="btn-remove-link" onclick="removeDropdownLink('${item.dropdownListId}')">
                <svg style="width:12px;height:12px;stroke:var(--text-muted);stroke-width:2;fill:none;" viewBox="0 0 24 24">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          `;
          container.appendChild(div);
        });
      }

      function updateSelectedDropdownRange(inputEl, id) {
        var found = currentSelectedDropdowns.find(function(d) { return d.dropdownListId === id; });
        if (found) {
          found.range = inputEl.value.trim();
        }
      }

      function removeDropdownLink(id) {
        currentSelectedDropdowns = currentSelectedDropdowns.filter(function(d) { return d.dropdownListId !== id; });
        renderSelectedDropdownsArea();
      }

      function renderSelectedSheetsArea() {
        var container = document.getElementById('selectedSheetsArea');
        if (!currentSelectedSheets || currentSelectedSheets.length === 0) {
          container.innerHTML = "<span class='sheet-tag-empty'>Chưa chọn sheet nào. Nhấp [Sửa] để chọn.</span>";
          return;
        }
        var html = "";
        currentSelectedSheets.forEach(function(s) {
          html += `<span class="sheet-tag">${escapeHtml(s)}</span>`;
        });
        container.innerHTML = html;
      }

      /* ================================================
         LOGIC CHO MODAL CHỌN DROPDOWNS LIÊN KẾT
         ================================================ */
      function openDropdownSelector() {
        var container = document.getElementById('selectorList');
        container.innerHTML = "";

        if (!allLists || allLists.length === 0) {
          container.innerHTML = "<p style='color: var(--text-muted); font-style: italic; font-size: 12px; margin: 10px 0;'>Vui lòng tạo ít nhất một danh sách dropdown ở bên dưới trước.</p>";
        } else {
          allLists.forEach(function(list) {
            var isChecked = currentSelectedDropdowns.some(function(d) { return d.dropdownListId === list.id; });
            var div = document.createElement('div');
            div.className = "selector-item";
            div.innerHTML = `
              <input type="checkbox" id="chk_${list.id}" value="${list.id}" ${isChecked ? 'checked' : ''}>
              <label for="chk_${list.id}">${escapeHtml(list.name)}</label>
            `;
            container.appendChild(div);
          });
        }
        
        document.getElementById('dropdownSelectorModal').style.display = "flex";
      }

      // Đóng modal chọn
      function closeDropdownSelector() {
        document.getElementById('dropdownSelectorModal').style.display = "none";
      }

      function applyDropdownSelection() {
        var checkboxes = document.querySelectorAll('#selectorList input[type="checkbox"]');
        var newSelected = [];

        checkboxes.forEach(function(chk) {
          if (chk.checked) {
            var id = chk.value;
            var existing = currentSelectedDropdowns.find(function(d) { return d.dropdownListId === id; });
            if (existing) {
              newSelected.push(existing);
            } else {
              newSelected.push({
                dropdownListId: id,
                range: "A1:A100"
              });
            }
          }
        });

        currentSelectedDropdowns = newSelected;
        renderSelectedDropdownsArea();
        closeDropdownSelector();
      }

      /* ================================================
         LOGIC CHO MODAL CHỌN CÁC SHEET LIÊN KẾT
         ================================================ */
      function openSheetSelector() {
        var container = document.getElementById('sheetSelectorList');
        container.innerHTML = "<div style='color: var(--text-muted); text-align: center; padding: 15px 0;'>Đang tải danh sách sheet...</div>";
        document.getElementById('sheetSelectorModal').style.display = "flex";

        callApi('getSheetNames', null,
          function(names) {
            container.innerHTML = "";
            if (!names || names.length === 0) {
              container.innerHTML = "<p style='color: var(--text-muted); font-style: italic; font-size: 12px; margin: 10px 0;'>Không tìm thấy hoặc không thể tải tên các sheet.</p>";
              return;
            }
            names.forEach(function(name) {
              var isChecked = currentSelectedSheets.indexOf(name) > -1;
              var div = document.createElement('div');
              div.className = "selector-item";
              div.innerHTML = `
                <input type="checkbox" id="chk_sheet_${name}" value="${escapeHtml(name)}" ${isChecked ? 'checked' : ''}>
                <label for="chk_sheet_${name}">${escapeHtml(name)}</label>
              `;
              container.appendChild(div);
            });
          },
          function(err) {
            container.innerHTML = "<div style='color: var(--danger); text-align: center; padding: 15px 0;'>Lỗi kết nối khi tải tên các sheet.</div>";
          }
        );
      }

      function closeSheetSelector() {
        document.getElementById('sheetSelectorModal').style.display = "none";
      }

      function applySheetSelection() {
        var checkboxes = document.querySelectorAll('#sheetSelectorList input[type="checkbox"]');
        var selected = [];
        checkboxes.forEach(function(chk) {
          if (chk.checked) {
            selected.push(chk.value);
          }
        });
        currentSelectedSheets = selected;
        renderSelectedSheetsArea();
        closeSheetSelector();
      }

      /* ================================================
         LƯU & XÓA DROPDOWN RULE
         ================================================ */
      function saveCurrentRule() {
        var name = document.getElementById('ruleName').value.trim();
        var matchType = document.getElementById('matchType').value;
        var matchValue = document.getElementById('matchValue').value.trim();
        
        if (!name) { showCustomAlert("Vui lòng nhập Tên quy tắc!"); return; }
        if (matchType !== 'all' && matchType !== 'selected' && !matchValue) { 
          showCustomAlert("Vui lòng nhập từ khóa tìm kiếm tên Sheet!"); 
          return; 
        }
        if (matchType === 'selected' && currentSelectedSheets.length === 0) {
          showCustomAlert("Người dùng không select sheet nào khi chọn sheet áp dụng là option 'Các sheet được lựa chọn'. Vui lòng chọn ít nhất 1 sheet!");
          return;
        }
        if (currentSelectedDropdowns.length === 0) { 
          showCustomAlert("Người dùng không select dropdown list nào trong dropdown rules. Vui lòng liên kết ít nhất 1 dropdown!"); 
          return; 
        }

        var rangeEmpty = currentSelectedDropdowns.some(function(d) { return !d.range.trim(); });
        if (rangeEmpty) { showCustomAlert("Vui lòng không để trống dải ô (Range) áp dụng!"); return; }

        var ruleData = {
          id: document.getElementById('ruleId').value,
          name: name,
          matchType: matchType,
          matchValue: matchType === 'selected' ? "" : matchValue,
          selectedSheets: matchType === 'selected' ? currentSelectedSheets : [],
          dropdowns: currentSelectedDropdowns
        };

        var statusDiv = document.getElementById('status');
        statusDiv.style.display = "block";
        statusDiv.innerText = "Đang xử lý quy tắc...";
        statusDiv.style.backgroundColor = "var(--warning-bg)";
        statusDiv.style.color = "#856404";
        statusDiv.style.border = "1px solid #ffeeba";

        callApi('saveRule', ruleData,
          function(response) {
            if (response.success) {
              statusDiv.innerText = response.message;
              statusDiv.style.backgroundColor = "var(--success-bg)";
              statusDiv.style.color = "#155724";
              statusDiv.style.border = "1px solid #c3e6cb";
              setTimeout(backToList, 2000);
            } else {
              statusDiv.innerText = "Lỗi: " + response.message;
              statusDiv.style.backgroundColor = "var(--danger-bg)";
              statusDiv.style.color = "#721c24";
              statusDiv.style.border = "1px solid #f5c6cb";
            }
          },
          function(err) {
            statusDiv.innerText = "Lỗi kết nối hệ thống: " + err.toString();
            statusDiv.style.backgroundColor = "var(--danger-bg)";
            statusDiv.style.color = "#721c24";
            statusDiv.style.border = "1px solid #f5c6cb";
          }
        );
      }

      function deleteRuleFromCard(event, id) {
        event.stopPropagation();
        showCustomConfirm(
          "Xóa quy tắc",
          "Bạn có chắc chắn muốn xóa quy tắc này? Nó chỉ xóa cấu hình trong Sidebar, các dropdown cũ trên Sheet vẫn giữ nguyên.",
          function() {
            callApi('deleteRule', id,
              function(response) {
                if (response.success) {
                  refreshAllData();
                } else {
                  showCustomAlert("Lỗi khi xóa: " + response.message);
                }
              },
              function(err) {
                showCustomAlert("Lỗi kết nối khi xóa: " + err.toString());
              }
            );
          }
        );
      }

    </script>
  </body>
</html>
