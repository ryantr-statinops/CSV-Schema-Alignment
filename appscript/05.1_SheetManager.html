      /* ================================================
         LOGIC MODAL ĐỔI MÀU SHEET & THƯ MỤC
         ================================================ */
      function openChangeColorModal(targetId, currentColor, targetType) {
        document.getElementById('colorTargetId').value = targetId;
        document.getElementById('colorTargetType').value = targetType;
        
        // Chuyển màu tab Google Sheets đậm về pastel khi so sánh active
        var mappedPastelColor = (targetType === 'sheet') ? getPastelColor(currentColor) : currentColor;
        selectedColorHex = mappedPastelColor || null;

        var titleText = (targetType === 'sheet') ? 'Chọn màu Tab Sheet' : 'Chọn màu nền Thư mục';
        if (targetType === 'bulk') {
          titleText = 'Đổi màu hàng loạt (' + Object.keys(selectedSheets).length + ' sheets)';
        }
        document.getElementById('colorModalTitle').innerText = titleText;
        
        var options = document.querySelectorAll('.color-option');
        options.forEach(function(opt) {
          opt.classList.remove('active');
          if (opt.getAttribute('data-color') === selectedColorHex) {
            opt.classList.add('active');
          }
        });

        openModal('changeColorModal');
      }

      function selectColorOption(el) {
        var options = document.querySelectorAll('.color-option');
        options.forEach(function(opt) { opt.classList.remove('active'); });
        
        el.classList.add('active');
        selectedColorHex = el.getAttribute('data-color');
      }

      function resetColor() {
        selectedColorHex = null;
        submitChangeColor();
      }

      function submitChangeColor() {
        var targetId = document.getElementById('colorTargetId').value;
        var targetType = document.getElementById('colorTargetType').value;
        closeModal('changeColorModal');

        if (targetType === 'bulk') {
          var sheetNames = Object.keys(selectedSheets);
          // Optimistic update locally
          sheetNames.forEach(function(name) {
            if (sheetDetails[name]) {
              sheetDetails[name].color = selectedColorHex;
            }
          });
          clearBulkSelection();
          renderData();

          callApi('changeBulkSheetsColor', { sheetNames: sheetNames, color: selectedColorHex },
            function(res) {
              if (!res.success) {
                showCustomAlert(res.message);
                refreshData();
              }
            }
          );
        } else if (targetType === 'sheet') {
          // Optimistic update locally
          if (sheetDetails[targetId]) {
            sheetDetails[targetId].color = selectedColorHex;
            renderData();
          }

          callApi('changeSheetColor', { sheetName: targetId, color: selectedColorHex },
            function(res) {
              if (!res.success) {
                showCustomAlert(res.message);
                refreshData();
              }
            }
          );
        } else {
          // Optimistic update locally
          if (folders[targetId]) {
            folders[targetId].color = selectedColorHex;
            renderData();
          }

          callApi('changeFolderColor', { folderId: targetId, color: selectedColorHex },
            function(res) {
              if (!res.success) {
                showCustomAlert(res.message);
                refreshData();
              }
            }
          );
        }
      }

      /* ================================================
         LOGIC MODAL DI CHUYỂN SHEET VÀO THƯ MỤC
         ================================================ */
      function openMoveToFolderModal(sheetName, parentFolderId) {
        document.getElementById('moveSheetName').value = sheetName;
        var select = document.getElementById('folderSelect');
        select.innerHTML = '<option value="">(Không thuộc thư mục - Root)</option>';
        
        rootOrder.forEach(function(item) {
          if (item.type === 'folder') {
            var folder = folders[item.id];
            if (folder) {
              var isSelected = (item.id === parentFolderId) ? 'selected' : '';
              select.innerHTML += `<option value="${item.id}" ${isSelected}>${escapeHtml(folder.name)}</option>`;
            }
          }
        });

        openModal('moveToFolderModal');
      }

      function submitMoveToFolder() {
        var name = document.getElementById('moveSheetName').value;
        var folderId = document.getElementById('folderSelect').value || null;
        
        closeModal('moveToFolderModal');

        if (name === "__BULK__") {
          showToast("Đang di chuyển hàng loạt...");
          var sheetNames = Object.keys(selectedSheets);
          callApi('moveBulkSheetsToFolder', { sheetNames: sheetNames, folderId: folderId },
            function(res) {
              showToast(res.message);
              if (res.success) {
                clearBulkSelection();
                refreshData();
              }
            }
          );
        } else {
          showToast("Đang di chuyển sheet...");
          callApi('moveSheetToFolder', { sheetName: name, folderId: folderId },
            function(res) {
              showToast(res.message);
              if (res.success) refreshData();
            }
          );
        }
      }

      /* ================================================
         LOGIC THAO TÁC HÀNG LOẠT (BULK ACTIONS FRONTEND)
         ================================================ */


      function onSheetCheckboxClick(checkbox) {
        var name = checkbox.getAttribute('data-name');
        if (checkbox.checked) {
          selectedSheets[name] = true;
        } else {
          delete selectedSheets[name];
        }
        updateBulkActionBar();
        updateFolderCheckboxesState();
      }

      function updateBulkActionBar() {
        var count = Object.keys(selectedSheets).length;
        var bar = document.getElementById('bulkActionBar');
        if (count > 0) {
          bar.style.display = 'flex';
          document.getElementById('bulkSelectCount').innerText = 'Đã chọn ' + count + ' sheets';
        } else {
          bar.style.display = 'none';
        }
      }

      function clearBulkSelection() {
        selectedSheets = {};
        updateBulkActionBar();
        var checkboxes = document.querySelectorAll('.sheet-select-checkbox, .folder-select-checkbox');
        checkboxes.forEach(function(cb) { cb.checked = false; });
      }

      function openBulkChangeColorModal() {
        openChangeColorModal('', '', 'bulk');
      }

      function openBulkMoveToFolderModal() {
        document.getElementById('moveSheetName').value = "__BULK__";
        var select = document.getElementById('folderSelect');
        select.innerHTML = '<option value="">(Không thuộc thư mục - Root)</option>';
        
        rootOrder.forEach(function(item) {
          if (item.type === 'folder') {
            var folder = folders[item.id];
            if (folder) {
              select.innerHTML += `<option value="${item.id}">${escapeHtml(folder.name)}</option>`;
            }
          }
        });

        openModal('moveToFolderModal');
      }

      function submitBulkDuplicate() {
        var sheetNames = Object.keys(selectedSheets);
        if (sheetNames.length === 0) return;
        
        showToast("Đang nhân bản hàng loạt...");
        callApi('duplicateBulkSheets', { sheetNames: sheetNames }, function(res) {
          if (res) {
            showToast(res.message);
            if (res.success) {
              clearBulkSelection();
              refreshData();
            }
          }
        });
      }

      function triggerBulkDelete() {
        var sheetNames = Object.keys(selectedSheets);
        if (sheetNames.length === 0) return;

        showToast("Đang kiểm tra dữ liệu...");
        callApi('checkDatabaseSheets', { sheetNames: sheetNames }, function(res) {
          if (!res || !res.success) {
            performNormalBulkDelete(sheetNames);
            return;
          }

          var dbSheetsInfo = res.dbSheets || [];
          var dbSheetNames = dbSheetsInfo.map(function(item) { return item.sheetName; });
          var nonDbSheets = sheetNames.filter(function(name) { return dbSheetNames.indexOf(name) === -1; });

          if (dbSheetsInfo.length === 0) {
            performNormalBulkDelete(sheetNames);
            return;
          }

          if (nonDbSheets.length > 0) {
            showCustomConfirm(
              "Xóa sheet không phải DATABASE",
              "Bạn có chắc chắn muốn xóa " + nonDbSheets.length + " sheet không phải database đã chọn không? (Không thể hoàn tác).",
              function() {
                showToast("Đang xóa sheet thường...");
                callApi('deleteBulkSheets', { sheetNames: nonDbSheets }, function(resDel) {
                  if (resDel && resDel.success) {
                    nonDbSheets.forEach(function(n) { delete selectedSheets[n]; });
                    updateBulkActionBar();
                    refreshData();
                    
                    setTimeout(function() {
                      askAndDeleteDatabaseSheets(dbSheetsInfo);
                    }, 500);
                  } else {
                    showCustomAlert("Lỗi xóa sheet: " + (resDel ? resDel.message : "Thất bại"));
                  }
                });
              },
              false
            );
          } else {
            askAndDeleteDatabaseSheets(dbSheetsInfo);
          }
        }, function(err) {
          performNormalBulkDelete(sheetNames);
        });
      }

      function performNormalBulkDelete(sheetNames) {
        showCustomConfirm(
          "Xóa hàng loạt",
          "Bạn có chắc chắn muốn xóa " + sheetNames.length + " sheet đã chọn không? (Không thể hoàn tác).",
          function() {
            showToast("Đang xóa hàng loạt...");
            callApi('deleteBulkSheets', { sheetNames: sheetNames }, function(res) {
              if (res) {
                showToast(res.message);
                if (res.success) {
                  clearBulkSelection();
                  refreshData();
                }
              }
            });
          }
        );
      }

      // Hàm con hiển thị popup hỏi xác nhận riêng cho Database Sheets
      function askAndDeleteDatabaseSheets(dbSheetsInfo) {
        if (dbSheetsInfo.length === 0) return;
        
        if (dbSheetsInfo.length === 1) {
          var item = dbSheetsInfo[0];
          showCustomConfirm(
            "Xóa Sheet DATABASE",
            "CẢNH BÁO: Sheet '" + item.sheetName + "' này là DATABASE của bản mẫu '" + item.templateName + "'. Nếu xóa thì sẽ xóa luôn cái mối quan hệ database - sheet này. Bạn có chắc chắn muốn XÓA VĨNH VIỄN không?",
            function() {
              showToast("Đang xóa DATABASE sheet...");
              callApi('deleteSheet', item.sheetName, function(resDel) {
                showToast(resDel.message);
                if (resDel.success) {
                  delete selectedSheets[item.sheetName];
                  updateBulkActionBar();
                  refreshData();
                }
              });
            },
            false
          );
        } else {
          var sheetNamesList = dbSheetsInfo.map(function(i) { return i.sheetName; });
          var msg = "CẢNH BÁO: Các sheet sau đây đang đóng vai trò là DATABASE của các bản mẫu tương ứng:<br>";
          dbSheetsInfo.forEach(function(i) {
            msg += "- Sheet <b>" + i.sheetName + "</b> (Bản mẫu: " + i.templateName + ")<br>";
          });
          msg += "Nếu xóa chúng đi thì sẽ xóa luôn các mối quan hệ database trong các bản mẫu đó. Bạn có chắc chắn muốn XÓA VĨNH VIỄN không?";

          showCustomConfirm(
            "Xóa các Sheet DATABASE",
            msg,
            function() {
              showToast("Đang xóa các DATABASE sheets...");
              callApi('deleteBulkSheets', { sheetNames: sheetNamesList }, function(resDel) {
                if (resDel) {
                  showToast(resDel.message);
                  if (resDel.success) {
                    sheetNamesList.forEach(function(name) { delete selectedSheets[name]; });
                    updateBulkActionBar();
                    refreshData();
                  }
                }
              });
            },
            false
          );
        }
      }

      function toggleSelectMode() {
        isSelectMode = !isSelectMode;
        var checkMark = document.getElementById('selectModeCheckMark');
        var btn = document.getElementById('toggleSelectModeBtn');
        if (isSelectMode) {
          checkMark.style.display = 'block';
          btn.style.backgroundColor = 'rgba(37, 99, 235, 0.08)';
          btn.style.borderColor = 'var(--primary)';
          btn.style.color = 'var(--primary)';
        } else {
          checkMark.style.display = 'none';
          btn.style.backgroundColor = '';
          btn.style.borderColor = '';
          btn.style.color = '';
          clearBulkSelection();
        }
        renderData();
      }

      function toggleBulkKebabMenu(event) {
        event.stopPropagation();
        var dropdown = document.getElementById('bulkKebabDropdown');
        if (!dropdown) return;
        
        // Đóng các dropdown khác
        var allDropdowns = document.querySelectorAll('.kebab-dropdown');
        allDropdowns.forEach(function(d) {
          if (d.id !== 'bulkKebabDropdown') {
            d.style.display = 'none';
            var card = d.closest('.sheet-card') || d.closest('.folder-card');
            if (card) card.classList.remove('active-menu');
          }
        });

        if (dropdown.style.display === 'block') {
          dropdown.style.display = 'none';
        } else {
          dropdown.style.display = 'block';
        }
      }

      function closeBulkKebabMenu() {
        var dropdown = document.getElementById('bulkKebabDropdown');
        if (dropdown) dropdown.style.display = 'none';
      }

      /* ================================================
         LOGIC BỔ SUNG THÀNH PHẦN (GHI CHÚ & TAGS)
         ================================================ */
      function renderNotesIcons(sheetName, comp) {
        if (!comp || !comp.notesEnabled || !comp.notes) return '';
        var html = '';
        comp.notes.forEach(function(note, idx) {
          if (note.active) {
            html += `
              <span class="note-badge-btn" onclick="showNoteDialog(event, '${escapeJsString(sheetName)}', ${idx})" title="${escapeHtml(note.title)}" style="cursor: pointer; font-size: 11px; padding: 2px; user-select: none; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.25)'" onmouseout="this.style.transform='scale(1)'">
                ${note.icon}
              </span>
            `;
          }
        });
        return html;
      }

      function renderTagsList(comp) {
        if (!comp || !comp.tagsEnabled || !comp.tags) return '';
        var html = '';
        comp.tags.forEach(function(tag) {
          if (tag.name) {
            html += `
              <span style="font-size: 8px; font-weight: 600; padding: 2px 5px; background-color: ${tag.color || 'var(--primary)'}; color: #ffffff; border-radius: 4px; display: inline-block; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1;" title="${escapeHtml(tag.name)}">
                ${escapeHtml(tag.name)}
              </span>
            `;
          }
        });
        return html;
      }

      function openComponentsModal(sheetName) {
        // Đóng kebab dropdown trước
        var allDropdowns = document.querySelectorAll('.kebab-dropdown');
        allDropdowns.forEach(function(d) { d.style.display = 'none'; });

        document.getElementById('componentsSheetName').value = sheetName;
        var current = sheetComponents[sheetName] || { notesEnabled: false, tagsEnabled: false, notes: [], tags: [] };

        document.getElementById('enableNotesCheckbox').checked = !!current.notesEnabled;
        document.getElementById('enableTagsCheckbox').checked = !!current.tagsEnabled;

        // Render Ghi chú hiện tại động
        document.getElementById('notesList').innerHTML = '';
        if (current.notes) {
          current.notes.forEach(function(note) {
            addNoteRowElement(note.title, note.icon, note.text);
          });
        }
        updateAddNoteButtonState();

        // Render Tags hiện tại động
        document.getElementById('tagsList').innerHTML = '';
        if (current.tags) {
          current.tags.forEach(function(tag) {
            addTagRowElement(tag.name, tag.color);
          });
        }
        updateAddTagButtonState();
        toggleComponentsArea();

        openModal('componentsModal');
      }

      function toggleComponentsArea() {
        var notesChecked = document.getElementById('enableNotesCheckbox').checked;
        var tagsChecked = document.getElementById('enableTagsCheckbox').checked;
        document.getElementById('notesConfigContainer').style.display = notesChecked ? 'block' : 'none';
        document.getElementById('tagsConfigContainer').style.display = tagsChecked ? 'block' : 'none';
      }

      function addNewNoteRow() {
        var rows = document.querySelectorAll('.note-edit-item');
        if (rows.length >= 3) return;
        addNoteRowElement('', '📄', '');
        updateAddNoteButtonState();
      }

      function addNoteRowElement(title, icon, text) {
        var item = document.createElement('div');
        item.className = 'note-edit-item';
        item.style = 'border: 1px solid var(--border-color); padding: 6px; border-radius: var(--radius-md); background: #f8fafc; position: relative; margin-bottom: 6px; box-sizing: border-box;';
        item.innerHTML = `
          <button class="btn" onclick="removeNoteRow(this)" style="position: absolute; right: 4px; top: 4px; padding: 2px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center;" title="Xóa ghi chú">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--danger);">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
          
          <div style="display: flex; gap: 4px; margin-bottom: 4px; padding-right: 20px;">
            <input type="text" class="note-title-input" value="${escapeHtml(title)}" placeholder="Tiêu đề (ví dụ: Chú ý)" style="flex-grow: 1; font-size: 11px; padding: 3px 6px; margin: 0; height: 22px; width: 100%; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
            <select class="note-icon-select" style="width: auto; font-size: 11px; padding: 2px; margin: 0; height: 22px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
              <option value="📄" ${icon === '📄' ? 'selected' : ''}>📄</option>
              <option value="✏️" ${icon === '✏️' ? 'selected' : ''}>✏️</option>
              <option value="⚠️" ${icon === '⚠️' ? 'selected' : ''}>⚠️</option>
              <option value="📌" ${icon === '📌' ? 'selected' : ''}>📌</option>
              <option value="❓" ${icon === '❓' ? 'selected' : ''}>❓</option>
            </select>
          </div>
          <textarea class="note-text-textarea" placeholder="Nội dung tối đa 200 chữ" maxlength="200" style="width: 100%; height: 45px; font-size: 11px; padding: 4px; margin: 0; box-sizing: border-box; resize: none; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">${escapeHtml(text)}</textarea>
        `;
        document.getElementById('notesList').appendChild(item);
      }

      function removeNoteRow(btn) {
        var row = btn.closest('.note-edit-item');
        var titleInput = row.querySelector('.note-title-input');
        var title = titleInput ? titleInput.value.trim() : "";
        var displayName = title ? "'" + title + "'" : "này";
        
        showCustomConfirm(
          "Loại bỏ Ghi chú",
          "Bạn có chắc chắn muốn loại bỏ ghi chú " + displayName + " không?",
          function() {
            row.remove();
            updateAddNoteButtonState();
          }
        );
      }

      function updateAddNoteButtonState() {
        var rows = document.querySelectorAll('.note-edit-item');
        document.getElementById('btnAddNote').disabled = (rows.length >= 3);
      }

      function addNewTagRow() {
        var rows = document.querySelectorAll('.tag-edit-row');
        if (rows.length >= 3) return;
        addTagRowElement('', '#2563EB');
        updateAddTagButtonState();
      }

      function addTagRowElement(name, color) {
        var item = document.createElement('div');
        item.className = 'tag-edit-row';
        item.style = 'display: flex; gap: 4px; align-items: center;';
        item.innerHTML = `
          <input type="text" class="tag-name-input" value="${escapeHtml(name)}" placeholder="Tag name (max 10 ký tự)" maxlength="10" style="flex-grow: 1; font-size: 11px; padding: 3px 6px; margin: 0; height: 22px;">
          <input type="color" class="tag-color-input" value="${color || '#2563EB'}" style="width: 26px; height: 22px; padding: 0; border: none; cursor: pointer; background: transparent; flex-shrink: 0; margin: 0;">
          <button class="btn" onclick="removeTagRow(this)" style="padding: 2px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; flex-shrink: 0; margin: 0; height: 22px;" title="Xóa tag">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--danger);">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
        `;
        document.getElementById('tagsList').appendChild(item);
      }

      function removeTagRow(btn) {
        var row = btn.closest('.tag-edit-row');
        var nameInput = row.querySelector('.tag-name-input');
        var name = nameInput ? nameInput.value.trim() : "";
        var displayName = name ? "'" + name + "'" : "này";
        
        showCustomConfirm(
          "Loại bỏ Tag",
          "Bạn có chắc chắn muốn loại bỏ tag " + displayName + " không?",
          function() {
            row.remove();
            updateAddTagButtonState();
          }
        );
      }

      function updateAddTagButtonState() {
        var rows = document.querySelectorAll('.tag-edit-row');
        document.getElementById('btnAddTag').disabled = (rows.length >= 3);
      }

      function submitSaveComponents() {
        var sheetName = document.getElementById('componentsSheetName').value;
        var notesEnabled = document.getElementById('enableNotesCheckbox').checked;
        var tagsEnabled = document.getElementById('enableTagsCheckbox').checked;

        var notes = [];
        if (notesEnabled) {
          var noteItems = document.querySelectorAll('.note-edit-item');
          noteItems.forEach(function(item) {
            var title = item.querySelector('.note-title-input').value.trim();
            var icon = item.querySelector('.note-icon-select').value;
            var text = item.querySelector('.note-text-textarea').value.trim();
            if (title && text) {
              notes.push({
                active: true,
                title: title,
                icon: icon,
                text: text.substring(0, 200)
              });
            }
          });
        }

        var tags = [];
        if (tagsEnabled) {
          var tagRows = document.querySelectorAll('.tag-edit-row');
          tagRows.forEach(function(row) {
            var name = row.querySelector('.tag-name-input').value.trim();
            var color = row.querySelector('.tag-color-input').value;
            if (name) {
              tags.push({
                name: name.substring(0, 10),
                color: color
              });
            }
          });
        }

        closeModal('componentsModal');
        
        // Optimistic update locally
        sheetComponents[sheetName] = {
          notesEnabled: notesEnabled,
          tagsEnabled: tagsEnabled,
          notes: notes,
          tags: tags
        };
        renderData();

        callApi('saveSheetComponents', {
          sheetName: sheetName,
          components: {
            notesEnabled: notesEnabled,
            tagsEnabled: tagsEnabled,
            notes: notes,
            tags: tags
          }
        }, function(res) {
          if (!res.success) {
            showCustomAlert(res.message);
            refreshData();
          }
        });
      }

      function showNoteDialog(event, sheetName, idx) {
        event.stopPropagation();
        var comp = sheetComponents[sheetName];
        if (comp && comp.notes && comp.notes[idx]) {
          var note = comp.notes[idx];
          document.getElementById('noteDisplayTitle').innerText = note.icon + " " + note.title;
          document.getElementById('noteDisplayText').innerText = note.text;
          openModal('noteDisplayModal');
        }
      }

      /* ================================================
         LOGIC TẠO MỚI SHEET TÙY CHỈNH (INTEGRATED)
         ================================================ */
      function openCreateCustomSheetModal() {
        document.getElementById('newCustomSheetName').value = "";
        document.getElementById('newCustomSheetType').value = "empty";
        onCustomSheetTypeChange();

        // 1. Đổ dữ liệu vào dropdown Templates
        var templateSelect = document.getElementById('customSheetTemplateSelect');
        templateSelect.innerHTML = "";
        if (templates.length === 0) {
          templateSelect.innerHTML = `<option value="">(Không có bản mẫu nào)</option>`;
        } else {
          templates.forEach(function(t) {
            templateSelect.innerHTML += `<option value="${t.id}">${escapeHtml(t.name)}</option>`;
          });
        }

        // 2. Đổ dữ liệu vào dropdown Sheet nguồn sao chép (Lấy từ sheetDetails)
        var copySelect = document.getElementById('customSheetCopySelect');
        copySelect.innerHTML = "";
        var sheetNames = Object.keys(sheetDetails);
        if (sheetNames.length === 0) {
          copySelect.innerHTML = `<option value="">(Không có sheet nguồn)</option>`;
        } else {
          sheetNames.forEach(function(name) {
            copySelect.innerHTML += `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`;
          });
        }

        openModal('createCustomSheetModal');
      }

      function onCustomSheetTypeChange() {
        var type = document.getElementById('newCustomSheetType').value;
        var templateArea = document.getElementById('customSheetTemplateArea');
        var copyArea = document.getElementById('customSheetCopyArea');

        if (type === 'template') {
          templateArea.style.display = "block";
          copyArea.style.display = "none";
        } else if (type === 'copy') {
          templateArea.style.display = "none";
          copyArea.style.display = "block";
        } else {
          templateArea.style.display = "none";
          copyArea.style.display = "none";
        }
      }

      function submitCreateCustomSheet() {
        var name = document.getElementById('newCustomSheetName').value.trim();
        var type = document.getElementById('newCustomSheetType').value;
        var templateId = (type === 'template') ? document.getElementById('customSheetTemplateSelect').value : null;
        var sourceSheetName = (type === 'copy') ? document.getElementById('customSheetCopySelect').value : null;

        if (!name) {
          showCustomAlert("Tên Sheet không được để trống!");
          return;
        }

        closeModal('createCustomSheetModal');
        showToast("Đang tạo Sheet mới...");

        callApi('createCustomSheet', {
          name: name,
          type: type,
          templateId: templateId,
          sourceSheetName: sourceSheetName
        }, function(res) {
          if (res) {
            showToast(res.message);
            if (res.success) {
              refreshData();
            } else {
              showCustomAlert(res.message);
            }
          } else {
            showToast("Lỗi: Phản hồi rỗng.");
          }
        });
      }
    </script>
  </body>
</html>
