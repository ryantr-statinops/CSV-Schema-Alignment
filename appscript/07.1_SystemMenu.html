<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-app: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-light: #eff6ff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --radius-lg: 12px;
        --radius-md: 8px;
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-app);
        font-family: 'Inter', sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        box-sizing: border-box;
      }

      .app-workspace {
        display: flex;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      /* Left Side: Display Area */
      .display-area {
        flex: 1;
        height: 100%;
        position: relative;
        overflow: hidden;
        background-color: var(--bg-app);
        padding: 12px;
        box-sizing: border-box;
      }

      .content-card {
        width: 100%;
        height: 100%;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .content-section {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 1;
        transform: scale(1);
        transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        z-index: 1;
      }

      .content-section.hidden {
        opacity: 0;
        transform: scale(0.98);
        pointer-events: none;
        z-index: 0;
      }

      .column-header {
        display: flex;
        align-items: center;
        padding: 14px 20px;
        background: #f8fafc;
        border-bottom: 1px solid var(--border-color);
      }

      .column-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .column-body {
        flex: 1;
        position: relative;
        background-color: #ffffff;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background-color: transparent;
      }

      /* Left Side: Sidebar Menu */
      .navigation-sidebar {
        width: 220px;
        height: 100%;
        background: var(--card-bg);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 8px rgba(0, 0, 0, 0.01);
        z-index: 10;
        box-sizing: border-box;
      }

      .sidebar-header {
        padding: 20px 20px 16px 20px;
        border-bottom: 1px solid var(--border-color);
      }

      .sidebar-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .sidebar-menu {
        flex: 1;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
      }

      .sidebar-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 13.5px;
        font-weight: 500;
        transition: var(--transition);
        user-select: none;
        border: 1px solid transparent;
      }

      .sidebar-item:hover {
        background-color: #f1f5f9;
        color: var(--text-main);
      }

      .sidebar-item.active {
        background-color: var(--accent-light);
        color: var(--accent);
        border-color: rgba(37, 99, 235, 0.08);
        font-weight: 600;
      }

      .item-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        stroke: var(--text-muted);
        transition: var(--transition);
      }

      .sidebar-item.active .item-icon {
        stroke: var(--accent);
      }

      .sidebar-item:hover:not(.active) .item-icon {
        stroke: var(--text-main);
      }

      .item-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* SCROLLBAR STYLE */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body>

              <line x1="3" y1="9" x2="21" y2="9"></line>

      <!-- Right Side: Display Area -->
      <div class="display-area">
        <div class="content-card">

            <div class="column-header">
              <div class="column-title">Quản lý Dropdown</div>

          <!-- Section 3: Template Manager -->

      </div>
    </div>

    <script>
      function selectTab(tabId) {
        // Toggle active class on sidebar items
        document.querySelectorAll('.sidebar-item').forEach(function(item) {
          item.classList.remove('active');
        });
        document.getElementById('tab-' + tabId).classList.add('active');

        // Toggle active section
        document.querySelectorAll('.content-section').forEach(function(section) {
          section.classList.add('hidden');
        });
        document.getElementById('section-' + tabId).classList.remove('hidden');
      }

      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'DATA_CHANGED') {
          var iframes = document.querySelectorAll('iframe');
          iframes.forEach(function(iframe) {
            try {
              if (iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'REFRESH_DATA' }, '*');
              }
            } catch(e) {}
          });
        }
      });

      // Bắt đầu vòng lặp đồng bộ ngầm kiểm tra phân quyền cho cửa sổ cha (5 giây/lần)
      setInterval(function() {
        google.script.run
          .withFailureHandler(function(err) {
            var errMsg = err.toString();
            if (errMsg.indexOf("Bạn không có quyền truy cập") !== -1) {
              google.script.run.showAccessDeniedAlert();
              google.script.host.close();
            }
          })
          .handleApiRequest({ action: 'getLastChangedTimestamp' });
      }, 5000);
    </script>
